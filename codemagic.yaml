workflows:
  android-workflow:
    name: Android APK Build
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter Pub Get
        script: |
          flutter clean
          flutter pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
