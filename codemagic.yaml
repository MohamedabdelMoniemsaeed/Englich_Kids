workflows:
  android-workflow:
    name: Android APK Build
    environment:
      flutter: stable
    scripts:
      - name: Remove old Capacitor android
        script: |
          rm -rf android
      - name: Create Flutter native android
        script: |
          flutter create --platforms=android .
      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk