name: english_kids_flutter
description: Complete Flutter app for English Kids learning and games.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  shared_preferences: ^2.2.2
  google_fonts: ^8.2.1
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
